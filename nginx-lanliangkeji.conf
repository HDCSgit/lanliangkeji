server {
    listen 80;
    listen [::]:80;
    server_name lanliangkeji.cn www.lanliangkeji.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/lanliangkeji/app/dist;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lanliangkeji.cn www.lanliangkeji.cn;

    ssl_certificate     /www/server/panel/vhost/cert/www.lanliangkeji.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/www.lanliangkeji.cn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /www/wwwroot/lanliangkeji/app/dist;
    index index.html;

    # SPA 路由
    location / {
        # 强制 HTML 不缓存(浏览器/微信 WebView 必须每次回源)
        # index.html meta http-equiv 不被所有 UA 遵守,HTTP 头级别才稳
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # 上传图片反代到后端(后端已经 mount /uploads + 30 天 cache header)
    # ^~ 锁定 prefix 优先,防止被下面的 ~* \.(png|...)$ 正则 location 抢先
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    # 后端 API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    client_max_body_size 10m;
}
