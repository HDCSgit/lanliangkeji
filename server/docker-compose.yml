version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: lanliang-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lanliang
      POSTGRES_PASSWORD: lanliang123
      POSTGRES_DB: lanliang
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lanliang -d lanliang"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lanliang-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://lanliang:lanliang123@db:5432/lanliang
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
